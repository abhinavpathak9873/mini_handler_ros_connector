/**:
  ros__parameters:
    # Auto-discovers exactly one mjbots fdcanusb by its /dev/serial/by-id identity.
    port: auto
    motor_id: 1
    simulate: false
    poll_hz: 50.0
    request_timeout_s: 0.10
    open_position_rev: -0.295181274
    # Auto-calibrated with the currently installed empty fingertips at the
    # configured 3.07 Nm open / 4.00 Nm close directional torque limits.
    # Motion-stall references; torque is a safety ceiling, not endpoint detection.
    close_position_rev: 0.328063965
    # Guarded calibration probes may search this far beyond either saved endpoint.
    calibration_probe_margin_rev: 0.25
    reconnect_interval_s: 1.0
    # Nominal old fixture labels; measure both endpoints before enabling mm commands.
    min_width_mm: 55.0
    max_width_mm: 105.0
    width_calibrated: false
    # Set only after load-cell calibration. 0 disables newton commands/estimates.
    force_n_per_nm: 0.0
    max_speed_rps: 1.0
    max_acceleration_rps2: 1.0
    max_torque_nm: 4.0
    open_torque_nm: 3.07
    close_torque_nm: 4.0
    default_speed_scale: 1.0
    default_acceleration_scale: 1.0
    command_timeout_s: 12.0
    settle_time_s: 0.15
    position_tolerance_rev: 0.002
    stationary_velocity_rps: 0.01
    contact_ratio: 0.95
    # Float telemetry for position/velocity/torque; optional slow diagnostics.
    extended_telemetry: true
    # Simulator object is at 35% opening. -1 means empty travel.
    simulated_contact_fraction: 0.35
